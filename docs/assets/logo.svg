<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AtomHax mark</title>
  <desc id="desc">Three colored orbital paths around a bright nucleus.</desc>
  <defs>
    <linearGradient id="orbitA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff4a"/>
      <stop offset="0.48" stop-color="#55d6ff"/>
      <stop offset="1" stop-color="#ff6b58"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f1eee6"/>
      <stop offset="0.32" stop-color="#c8ff4a"/>
      <stop offset="1" stop-color="#6f9a1c"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="246" height="246" rx="54" fill="#080a0b" stroke="#29312e" stroke-width="2"/>
  <g transform="translate(128 128)" fill="none" stroke-linecap="round" filter="url(#glow)">
    <ellipse rx="92" ry="35" stroke="url(#orbitA)" stroke-width="7" transform="rotate(-24)"/>
    <ellipse rx="92" ry="35" stroke="#55d6ff" stroke-width="5" opacity=".84" transform="rotate(36)"/>
    <ellipse rx="92" ry="35" stroke="#ff6b58" stroke-width="4" opacity=".76" transform="rotate(96)"/>
    <circle cx="92" cy="0" r="9" fill="#c8ff4a" stroke="none"/>
    <circle cx="-46" cy="-80" r="7" fill="#55d6ff" stroke="none"/>
    <circle cx="-18" cy="90" r="7" fill="#ff6b58" stroke="none"/>
    <circle r="23" fill="url(#core)" stroke="#f1eee6" stroke-width="2"/>
    <circle r="8" fill="#080a0b" stroke="none" opacity=".72"/>
  </g>
</svg>
