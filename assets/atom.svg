<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#c0c0c0"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
    <radialGradient id="electron" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e8e8e8"/>
      <stop offset="80%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#808080"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256,256)" filter="url(#glow)">
    <!-- Orbit 1: horizontal -->
    <ellipse cx="0" cy="0" rx="180" ry="65" fill="none" stroke="url(#orbit)" stroke-width="8" opacity="0.9" transform="rotate(0)"/>
    <!-- Orbit 2: rotated 60deg -->
    <ellipse cx="0" cy="0" rx="180" ry="65" fill="none" stroke="url(#orbit)" stroke-width="8" opacity="0.9" transform="rotate(60)"/>
    <!-- Orbit 3: rotated 120deg -->
    <ellipse cx="0" cy="0" rx="180" ry="65" fill="none" stroke="url(#orbit)" stroke-width="8" opacity="0.9" transform="rotate(120)"/>
    <!-- Electrons -->
    <circle cx="180" cy="0" r="18" fill="url(#electron)" filter="url(#shadow)"/>
    <circle cx="-90" cy="156" r="18" fill="url(#electron)" filter="url(#shadow)"/>
    <circle cx="-90" cy="-156" r="18" fill="url(#electron)" filter="url(#shadow)"/>
    <!-- Nucleus glow -->
    <circle cx="0" cy="0" r="20" fill="url(#electron)" opacity="0.3"/>
  </g>
</svg>